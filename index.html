<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <title>KaiZen | Perfumería — fragancias originales</title>
        <meta
            name="description"
            content="Perfumes originales de diseñador y árabes para mujer y hombre. Precios en dólares con referencia BCV, pago por Pago Móvil y envíos a toda Venezuela."
        />
        <meta name="theme-color" content="#0B0B0D" />
        <meta name="color-scheme" content="dark light" />

        <!--
          Applies the color theme before first paint (no flash of the wrong one): the saved
          choice ("kaizen-theme"), else the OS preference, else dark. Mirrors src/store/themeStore.ts.
        -->
        <script>
            ;(function () {
                var theme = null
                try {
                    theme = localStorage.getItem('kaizen-theme')
                } catch (error) {}
                if (theme !== 'light' && theme !== 'dark') {
                    try {
                        theme = matchMedia('(prefers-color-scheme: light)').matches
                            ? 'light'
                            : 'dark'
                    } catch (error) {
                        theme = 'dark'
                    }
                }
                var root = document.documentElement
                root.setAttribute('data-theme', theme)
                root.style.colorScheme = theme
                var meta = document.querySelector('meta[name="theme-color"]')
                if (meta) meta.setAttribute('content', theme === 'light' ? '#FAFAFA' : '#0B0B0D')
            })()
        </script>

        <!-- Link previews (WhatsApp, Instagram, Facebook, X). -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="es_VE" />
        <meta property="og:site_name" content="KaiZen" />
        <meta property="og:title" content="KaiZen | Perfumería — fragancias originales" />
        <meta
            property="og:description"
            content="Perfumes originales para mujer y hombre, con envíos a toda Venezuela y pago por Pago Móvil."
        />
        <meta property="og:image" content="/img/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="KaiZen Perfumería" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="KaiZen | Perfumería — fragancias originales" />
        <meta
            name="twitter:description"
            content="Perfumes originales para mujer y hombre, con envíos a toda Venezuela y pago por Pago Móvil."
        />
        <meta name="twitter:image" content="/img/og-image.png" />

        <!--
          Fonts load without blocking the first paint: the system font shows right away and
          `display=swap` switches to the brand fonts once they arrive.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            onload="
                this.onload = null
                this.rel = 'stylesheet'
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            />
        </noscript>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
