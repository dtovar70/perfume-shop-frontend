<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <title>KaiZen | Perfumería — fragancias originales</title>
        <meta
            name="description"
            content="Perfumes originales de diseñador y árabes para mujer y hombre. Precios en dólares con referencia BCV, pago por Pago Móvil y envíos a toda Venezuela."
        />
        <meta name="theme-color" content="#FFFAF7" />

        <!-- Link previews (WhatsApp, Instagram, Facebook, X). -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="es_VE" />
        <meta property="og:site_name" content="KaiZen" />
        <meta property="og:title" content="KaiZen | Perfumería — fragancias originales" />
        <meta
            property="og:description"
            content="Perfumes originales para mujer y hombre, con envíos a toda Venezuela y pago por Pago Móvil."
        />
        <meta property="og:image" content="/img/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="KaiZen Perfumería" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="KaiZen | Perfumería — fragancias originales" />
        <meta
            name="twitter:description"
            content="Perfumes originales para mujer y hombre, con envíos a toda Venezuela y pago por Pago Móvil."
        />
        <meta name="twitter:image" content="/img/og-image.png" />

        <!--
          Fonts load without blocking the first paint: the system font shows right away and
          `display=swap` switches to the brand fonts once they arrive.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"
            onload="
                this.onload = null
                this.rel = 'stylesheet'
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"
            />
        </noscript>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
